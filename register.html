<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Campus Events Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Campus Events Hub</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <section>

            <h2>Event Registration</h2>

            <p>
                Complete the form below to register for an upcoming Robotics Club event.
            </p>

            <form>

                <label for="name">Full Name</label><br>
                <input type="text" id="name" name="name"><br><br>

                <label for="email">Email</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="event">Choose Event</label><br>
                <select id="event" name="event">
                    <option>Robotics Workshop</option>
                    <option>Programming Competition</option>
                    <option>AI Seminar</option>
                </select><br><br>

                <label for="message">Comments</label><br>
                <textarea id="message" rows="5"></textarea><br><br>

                <button type="submit">Register</button>

            </form>

        </section>

    </main>

    <footer>
        <p>DS362 Web Development Project - Phase 2</p>
    </footer>

</body>

</html>
